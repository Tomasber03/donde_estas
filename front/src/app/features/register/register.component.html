<div class="min-h-screen flex items-center justify-center bg-[#F2F5FE] p-4 font-sans">
      <div class="bg-white p-8 rounded-[2rem] shadow-xl max-w-[500px] w-full text-center">

        <div class="mb-6">
          <div class="bg-[#0A0E21] text-white rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
              <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.061 1.061l1.59-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.061l1.59 1.59zM12 21.75a.75.75 0 01-.75-.75v-2.25a.75.75 0 011.5 0V21a.75.75 0 01.75.75zM6.166 17.834a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 10-1.061-1.061l-1.59 1.59zM2.25 12a.75.75 0 01.75-.75H5.25a.75.75 0 010 1.5H3a.75.75 0 01-.75-.75zM5.106 6.166a.75.75 0 001.06-1.06l1.59 1.591a.75.75 0 10-1.061 1.061l-1.59-1.59z" />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-800 mb-2">Crear Cuenta</h2>
          <p class="text-gray-500 text-sm leading-relaxed px-4">
            Unite a nuestra comunidad y ayudá a reunir mascotas con sus familias
          </p>
        </div>

        <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 border border-red-300 rounded-lg text-sm text-left">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="save()" class="space-y-4 text-left">

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="nombre" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Nombre</label>
              <input type="text" id="nombre" name="nombre" [(ngModel)]="form.nombre" placeholder="Tu nombre"
                class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium" required />
            </div>
            <div>
              <label for="apellido" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Apellido</label>
              <input type="text" id="apellido" name="apellido" [(ngModel)]="form.apellido" placeholder="Tu apellido"
                class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium" required />
            </div>
          </div>

          <div>
            <label for="email" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="form.email" placeholder="tu@email.com"
              class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium" required />
          </div>

          <div>
            <label for="telefono" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" [(ngModel)]="form.telefono" placeholder="+54 11 1234-5678"
              class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="barrio" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Barrio</label>
              <input type="text" id="barrio" name="barrio" [(ngModel)]="form.barrio" placeholder="Tu barrio"
                class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium" />
            </div>
            <div>
              <label for="ciudad" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Ciudad</label>
              <input type="text" id="ciudad" name="ciudad" [(ngModel)]="form.ciudad" placeholder="Tu ciudad"
                class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium" />
            </div>
          </div>

          <div>
            <label for="clave" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Contraseña</label>
            <input type="password" id="clave" name="clave" [(ngModel)]="form.clave" placeholder="........"
              class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium tracking-widest" required />
          </div>

          <div>
            <label for="confirmClave" class="block text-sm font-bold text-gray-700 mb-1 pl-1">Confirmar contraseña</label>
            <input type="password" id="confirmClave" name="confirmClave" placeholder="........"
              class="w-full p-3 bg-gray-100 border-transparent focus:border-gray-300 focus:bg-white focus:ring-0 rounded-lg text-gray-700 transition-all outline-none font-medium tracking-widest" />
          </div>

          <div class="pt-4">
            <button type="submit" class="w-full bg-[#0A0E21] hover:bg-opacity-90 text-white font-bold py-4 rounded-xl transition-colors duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
              Registrarse
            </button>
          </div>

        </form>

        <div class="mt-6 text-sm text-gray-500 font-medium">
          ¿Ya tenés cuenta?
          <a href="#" class="text-[#0A0E21] font-bold hover:underline ml-1">Iniciá sesión</a>
        </div>

      </div>
    </div>
