<div class="detalle-container" *ngIf="avistamiento; else loadingTpl">
  <!-- Botón volver -->
  <button (click)="volver()" class="btn-back">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Volver
  </button>

  <h1 class="title">Detalle del Avistamiento</h1>
  
  <div class="content-card">
    
    <!-- Información de la fecha -->
    <div class="info-section">
      <div class="date-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Reportado el {{ formatearFecha(avistamiento.fechaCreacion) }}</span>
      </div>
    </div>

    <!-- Sección de Fotografía -->
    <div class="section">
      <h2 class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        Fotografía del Avistamiento
      </h2>
      <div class="photo-display" *ngIf="avistamiento.fotos && avistamiento.fotos.length > 0">
        <img [src]="avistamiento.fotos[0].url" 
             alt="Foto del avistamiento" 
             class="photo-image" />
      </div>
      <div class="no-photo" *ngIf="!avistamiento.fotos || avistamiento.fotos.length === 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>No se tomaron fotos</p>
      </div>
    </div>

    <!-- Sección de Descripción -->
    <div class="section">
      <h2 class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Descripción del Avistamiento
      </h2>
      <div class="comment-display">
        <p>{{ avistamiento.comentario }}</p>
      </div>
    </div>

    <!-- Sección de Ubicación -->
    <div class="section">
      <h2 class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Ubicación del Avistamiento
      </h2>
      <app-map 
        [lat]="avistamiento.ubicacion.latitud" 
        [lng]="avistamiento.ubicacion.longitud">
      </app-map>
    </div>

    <!-- Botón para ver publicación relacionada -->
    <div class="actions">
      <button class="btn-primary" (click)="verPublicacion()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Ver Publicación Original
      </button>
    </div>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Cargando avistamiento...</p>
  </div>
</ng-template>
