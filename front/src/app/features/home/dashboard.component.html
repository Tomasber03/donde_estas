<div class="min-h-screen bg-gray-50 pb-12 font-sans">

      <main class="max-w-7xl mx-auto px-6 py-6 space-y-8">
        <section>
          <div class="flex items-center gap-2 mb-4 text-gray-700">
             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
              </svg>
              <h2 class="font-medium text-lg">Filtros de búsqueda</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 bg-white p-2 rounded-xl">
             <div class="md:col-span-6 relative">
                <input  [(ngModel)]="stringBusqueda" (ngModelChange)="filterPets()" type="text" class="block w-full pl-10 pr-3 py-3 border-none rounded-lg bg-gray-50 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Buscar por nombre, raza o ubicación...">
             </div>
             <div class="md:col-span-3 relative">
                <select [(ngModel)]="tipo" (ngModelChange)="filterPets()" class="block w-full pl-3 pr-10 py-3 border-none rounded-lg bg-gray-50 text-gray-700 focus:outline-none appearance-none cursor-pointer">
                  <option default value="todos">Todas las mascotas</option>
                  <option value="perro">Perros</option>
                  <option value="gato">Gatos</option>
                  <option value="otro">Otros</option>
                </select>
             </div>
          </div>
        </section>

        <section>
          <div class="flex flex-wrap gap-2 bg-gray-200/50 p-1 rounded-xl w-fit">
            <button *ngFor="let tab of tabs" (click)="onTabClick(tab)"
                    class="px-6 py-2 rounded-lg text-sm font-medium transition-all duration-200"
                    [ngClass]="tab.label === selectedTab ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600 hover:bg-gray-200/50'">
              {{ tab.label }} ({{ tab.count }})
            </button>
          </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <app-pet-card  *ngFor="let pet of filteredPetsList"  [pet]="pet"></app-pet-card>
        </section>

      </main>
    </div>
