<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-circle">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="30" fill="#1a1a2e"/>
          <path d="M25 22C25 19.2386 27.2386 17 30 17C32.7614 17 35 19.2386 35 22C35 24.7614 32.7614 27 30 27C27.2386 27 25 24.7614 25 22Z" fill="white"/>
          <path d="M30 30C24.4772 30 20 34.4772 20 40V43H40V40C40 34.4772 35.5228 30 30 30Z" fill="white"/>
          <circle cx="38" cy="20" r="4" fill="white"/>
          <circle cx="42" cy="28" r="3" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- Título -->
    <h1 class="title">Volvé a casa</h1>
    <p class="subtitle">Plataforma colaborativa para búsqueda de mascotas perdidas</p>

    <!-- Formulario -->
    <form class="login-form" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="tu@email.com"
          class="form-control"
          [(ngModel)]="email"
          [disabled]="isLoading"
          required
        />
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="········"
          class="form-control"
          [(ngModel)]="password"
          [disabled]="isLoading"
          required
        />
      </div>

      <!-- Mensaje de error -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Usuarios de prueba 
      <div class="test-users">
        <p class="test-users-title">Usuarios de prueba:</p>
        <ul class="test-users-list">
          <li>• maria@example.com</li>
          <li>• juan@example.com</li>
          <li>• carolina@example.com</li>
        </ul>
        <p class="test-note">(cualquier contraseña funciona)</p>
      </div>
      -->

      <!-- Botón -->
      <button type="submit" class="btn-login" [disabled]="isLoading">
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>

      <!-- Link registro -->
      <p class="register-link">
        ¿No tenés cuenta? <a href="/register">Regístrate</a>
      </p>
    </form>
  </div>
</div>
