<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="mb-6">
      <button (click)="cancel()" class="flex items-center text-gray-600 hover:text-gray-900 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Volver
      </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
      <h1 class="text-3xl font-bold text-gray-900 mb-6">Editar Publicación</h1>

      <form (ngSubmit)="onSubmit()" #editForm="ngForm">
        
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Descripción *
          </label>
          <textarea
            [(ngModel)]="descripcion"
            name="descripcion"
            required
            rows="6"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
            placeholder="Describe la situación de la mascota perdida..."></textarea>
          <p class="mt-1 text-sm text-gray-500">
            Incluye detalles importantes como el lugar donde se perdió, características distintivas, etc.
          </p>
        </div>

        <!-- Ubicación -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Ubicación *
          </label>
          <p class="text-sm text-gray-500 mb-3">
            Haz clic en el mapa o arrastra el marcador para seleccionar la ubicación
          </p>
          
          <!-- Mapa -->
          <div id="map-edit" class="w-full h-96 rounded-lg border border-gray-300 mb-4"></div>
          
          <!-- Campos de ubicación (auto-completados) -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">Ciudad</label>
              <input
                [(ngModel)]="ubicacion.ciudad"
                name="ciudad"
                type="text"
                readonly
                class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-gray-700"
                placeholder="Automático">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1">Barrio</label>
              <input
                [(ngModel)]="ubicacion.barrio"
                name="barrio"
                type="text"
                readonly
                class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-gray-700"
                placeholder="Automático">
            </div>
          </div>
        </div>

        <div class="flex gap-4">
          <button
            type="submit"
            [disabled]="loading || !editForm.valid"
            class="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-medium py-3 px-6 rounded-xl transition-colors duration-200">
            <span *ngIf="!loading">Guardar cambios</span>
            <span *ngIf="loading" class="flex items-center justify-center">
              <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Guardando...
            </span>
          </button>
          
          <button
            type="button"
            (click)="cancel()"
            class="px-6 py-3 border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium rounded-xl transition-colors duration-200">
            Cancelar
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
