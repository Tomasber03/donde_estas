<div class="min-h-screen bg-gray-50 py-8 px-4">
  <div class="max-w-xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Editar Mascota</h1>

      <div *ngIf="isLoading" class="text-center text-gray-500">
        Cargando información de la mascota...
      </div>

      <div *ngIf="!isLoading && errorMessage" class="text-red-600 mb-4">
        {{ errorMessage }}
      </div>

      <form *ngIf="!isLoading && mascota" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
          <input
            [(ngModel)]="mascota.nombre"
            name="nombre"
            type="text"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Especie *</label>
          <select
            [(ngModel)]="mascota.tipo"
            name="tipo"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
          >
            <option value="">Seleccionar</option>
            <option value="PERRO">Perro</option>
            <option value="GATO">Gato</option>
            <option value="OTRO">Otro</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Raza</label>
          <input
            [(ngModel)]="mascota.raza"
            name="raza"
            type="text"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
          <input
            [(ngModel)]="mascota.color"
            name="color"
            type="text"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tamaño</label>
          <select
            [(ngModel)]="mascota.tamano"
            name="tamano"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
          >
            <option value="">Seleccionar</option>
            <option value="PEQUENO">Pequeño</option>
            <option value="MEDIANO">Mediano</option>
            <option value="GRANDE">Grande</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
          <select
            [(ngModel)]="mascota.sexo"
            name="sexo"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent"
          >
            <option value="">Seleccionar</option>
            <option value="MACHO">Macho</option>
            <option value="HEMBRA">Hembra</option>
          </select>
        </div>

        <!-- Fotos existentes -->
        <div *ngIf="fotosExistentes.length > 0" class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Fotos actuales de la mascota
          </label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div *ngFor="let foto of fotosExistentes; let i = index" class="relative group">
              <img
                [src]="foto.url"
                [alt]="mascota.nombre"
                class="w-full h-32 object-cover rounded-lg border-2 border-gray-200"
              />
              <button
                type="button"
                (click)="eliminarFotoExistente(i)"
                class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Agregar nuevas fotos -->
        <div class="mt-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Agregar nuevas fotos
          </label>
          <div class="mt-2">
            <label
              class="flex items-center justify-center w-full px-4 py-6 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer hover:border-gray-400 transition-colors"
            >
              <div class="space-y-2 text-center">
                <svg
                  class="mx-auto h-12 w-12 text-gray-400"
                  stroke="currentColor"
                  fill="none"
                  viewBox="0 0 48 48"
                >
                  <path
                    d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <div class="text-sm text-gray-600">
                  <span class="font-semibold">Clic para subir fotos</span> o arrastra aquí
                </div>
                <p class="text-xs text-gray-500">PNG, JPG, GIF hasta 10MB</p>
              </div>
              <input
                type="file"
                class="hidden"
                accept="image/*"
                multiple
                (change)="onNuevasFotosSelected($event)"
              />
            </label>
          </div>

          <!-- Preview de nuevas fotos -->
          <div *ngIf="previewNuevas.length > 0" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div *ngFor="let url of previewNuevas; let i = index" class="relative group">
              <img
                [src]="url"
                class="w-full h-32 object-cover rounded-lg border-2 border-gray-200"
              />
              <button
                type="button"
                (click)="eliminarFotoNueva(i)"
                class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="flex gap-4 pt-4">
          <button
            type="submit"
            [disabled]="isSaving"
            class="flex-1 bg-gray-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
          >
            {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
          </button>

          <button
            type="button"
            (click)="cancelar()"
            [disabled]="isSaving"
            class="px-6 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
